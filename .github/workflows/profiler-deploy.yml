name: profiler — Deploy

on:
  push:
    branches:
      - main
      - preview
    paths:
      - 'apps/profiler/**'
      - 'packages/**'
      - 'spec/**'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: profiler-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter=profiler
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Set deploy environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "preview" ]; then
            echo "wrangler_env=--env preview" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler_env=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/profiler
          command: deploy ${{ steps.env.outputs.wrangler_env }}

      - name: Sync Supabase secrets to Cloudflare Workers
        working-directory: apps/profiler
        run: |
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL ${{ steps.env.outputs.wrangler_env }}
          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY ${{ steps.env.outputs.wrangler_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
