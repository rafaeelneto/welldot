name: publish — @welldot/pdf

on:
  push:
    branches:
      - preview
    paths:
      - 'packages/pdf/**'
      - 'packages/render/**'
      - 'packages/core/**'
      - 'packages/utils/**'
      - 'pnpm-lock.yaml'
    tags:
      - '@welldot/pdf@*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and pack without publishing)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set pre-release version (preview branch)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          CURRENT_VERSION=$(node -p "require('./packages/pdf/package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-next.${DATE}.${SHORT_SHA}"
          cd packages/pdf && npm version "$NEW_VERSION" --no-git-tag-version

      - name: Build @welldot/pdf (and its dependencies)
        run: pnpm turbo build --filter=@welldot/pdf

      - name: Test @welldot/pdf
        run: pnpm turbo test --filter=@welldot/pdf

      - name: Check CHANGELOG entry for the release (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME##*@}"
          node scripts/release-notes.mjs packages/pdf "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Publish stable to npm (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: pnpm publish --filter=@welldot/pdf --no-git-checks --access public

      - name: Create GitHub Release (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Publish next to npm (preview branch)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: pnpm publish --filter=@welldot/pdf --no-git-checks --access public --tag next

      - name: Dry run (pack only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: pnpm --filter=@welldot/pdf exec npm pack --dry-run

      - name: Print npm debug log on failure
        if: failure()
        run: cat /home/runner/.npm/_logs/*.log 2>/dev/null || echo "No npm logs found"
